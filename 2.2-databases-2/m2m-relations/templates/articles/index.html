<!DOCTYPE html>
<html>
<head>
    <title>Новости</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h1>Будь в курсе событий</h1>
        
        {% for article in articles %}
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title">{{ article.title }}</h5>
                    <p class="card-text">{{ article.text|truncatewords:20 }}</p>
                    <p class="card-text">
                        <small class="text-muted">{{ article.published_at }}</small>
                    </p>
                    <div>
                        {% for scope in article.scopes.all %}
                            <span class="badge {% if scope.is_main %}bg-primary{% else %}bg-secondary{% endif %}">
                                {{ scope.tag.name }}
                            </span>
                        {% empty %}
                            <span class="badge bg-secondary">Нет тегов</span>
                        {% endfor %}
                    </div>
                </div>
            </div>
        {% empty %}
            <p>Новостей пока нет.</p>
        {% endfor %}
    </div>
</body>
</html>
